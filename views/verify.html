<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Manager Dashboard
</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
rel="stylesheet"
href="/css/style.css">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<!-- ===================================== -->
<!-- NAVBAR -->
<!-- ===================================== -->


<nav class="navbar navbar-dark px-4 d-flex justify-content-between">

<div class="d-flex align-items-center gap-3">

<h2 class="glow m-0">

<i class="fa-solid fa-shield-halved"></i>

SecureVault X

</h2>

</div>

<div
class="d-flex align-items-center gap-4">

<div class="text-end">

<h6
id="loggedUserName"
class="mb-1 text-light fw-bold">
</h6>

<p
id="loggedUserEmail"
class="mb-1 text-info small">
</p>

<span
id="loggedUserRole"
class="badge bg-info">
</span>

</div>

<div
id="liveClock"
class="text-info fw-bold">
</div>

<button
id="logoutBtn"
class="cyber-btn">

<i class="fa-solid fa-right-from-bracket"></i>

Logout

</button>

</div>

</nav>



<!-- ===================================== -->
<!-- MAIN CONTAINER -->
<!-- ===================================== -->

<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-lg-10">

<!-- ===================================== -->
<!-- VERIFY CARD -->
<!-- ===================================== -->

<div class="cyber-card">

<h2 class="glow text-center mb-4">

<i class="fa-solid fa-shield-check"></i>

Verify Secure Document

</h2>

<form
id="verifyForm"
enctype="multipart/form-data">

<input
id="document"
type="file"
class="form-control cyber-input mb-4"
required>

<button
class="cyber-btn w-100">

<i class="fa-solid fa-check"></i>

Verify Integrity

</button>

</form>

<div
id="verificationResult"
class="mt-4">

</div>

</div>

<!-- ===================================== -->
<!-- RECENT VERIFICATIONS -->
<!-- ===================================== -->

<div class="cyber-card mt-5">

<h3 class="glow mb-4">

<i class="fa-solid fa-clock-rotate-left"></i>

Recent Verification Activity

</h3>

<div class="table-responsive">

<table
class="table table-dark table-hover align-middle">

<thead>

<tr>

<th>
Document
</th>

<th>
Status
</th>

<th>
Details
</th>

<th>
Timestamp
</th>

</tr>

</thead>

<tbody id="verificationLogs">

<tr>

<td colspan="4"
class="text-center text-secondary">

No verification activity yet

</td>

</tr>

</tbody>

</table>

</div>

</div>

</div>

</div>

</div>

<!-- ===================================== -->
<!-- USER INFO + LIVE CLOCK -->
<!-- ===================================== -->
<script>

try {

    const token =
    localStorage.getItem(
        'token'
    );

    if (token) {

        const base64Url =

        token.split('.')[1];

        const base64 =

        base64Url.replace(
            /-/g,
            '+'
        ).replace(
            /_/g,
            '/'
        );

        const payload =

        JSON.parse(

            decodeURIComponent(

                atob(base64)

                .split('')

                .map((c) =>

                    '%' +

                    ('00' + c.charCodeAt(0).toString(16))

                    .slice(-2)

                )

                .join('')

            )

        );

        document.getElementById(
            'loggedUserName'
        ).innerHTML =
        payload.username;

        document.getElementById(
            'loggedUserEmail'
        ).innerHTML =
        payload.email;

        document.getElementById(
            'loggedUserRole'
        ).innerHTML =
        payload.role.toUpperCase();
    }

    // LIVE CLOCK

    const clockElement =
    document.getElementById(
        'liveClock'
    );

    if (clockElement) {

        setInterval(() => {

            const now =
            new Date();

            clockElement.innerHTML =

            now.toLocaleTimeString();

        }, 1000);
    }

}

catch (error) {

    console.log(error);
}

</script>



<!-- ===================================== -->
<!-- SCRIPTS -->
<!-- ===================================== -->

<script src="/js/auth.js"></script>

<script src="/js/verify.js"></script>

</body>

</html>
