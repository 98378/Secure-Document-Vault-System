<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
User Dashboard
</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
rel="stylesheet"
href="/css/style.css">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<!-- ===================================== -->
<!-- NAVBAR -->
<!-- ===================================== -->

<nav class="navbar navbar-dark px-4 d-flex justify-content-between">

<h3 class="glow">

<i class="fa-solid fa-upload"></i>

Secure Upload Center

</h3>

<!-- USER INFO -->

<div
class="d-flex align-items-center gap-4">

<div class="text-end">

<h6
id="loggedUserName"
class="mb-1 text-light">
</h6>

<p
id="loggedUserEmail"
class="mb-1 text-info small">
</p>

<span
id="loggedUserRole"
class="badge bg-info">
</span>

</div>

<!-- LIVE CLOCK -->

<div
id="liveClock"
class="text-info">
</div>

<!-- LOGOUT BUTTON -->

<button
id="logoutBtn"
class="cyber-btn">

<i class="fa-solid fa-right-from-bracket"></i>

Logout

</button>

</div>

</nav>

<!-- ===================================== -->
<!-- MAIN CONTAINER -->
<!-- ===================================== -->

<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-lg-10">

<!-- ===================================== -->
<!-- UPLOAD CARD -->
<!-- ===================================== -->

<div class="cyber-card">

<h2 class="glow text-center mb-4">

<i class="fa-solid fa-file-shield"></i>

Upload Secure Document

</h2>

<form
id="uploadForm"
enctype="multipart/form-data">

<div class="upload-box mb-4">

<input
id="document"
type="file"
class="form-control cyber-input"
required>

</div>

<div class="mb-3 text-info small">

Allowed Files:
PDF, PNG, JPG, JPEG, TXT

<br>

Maximum Size:
5MB

</div>

<button
class="cyber-btn w-100">

<i class="fa-solid fa-cloud-arrow-up"></i>

Encrypt & Upload

</button>

</form>

<div
id="uploadResult"
class="mt-4">

</div>

</div>

<!-- ===================================== -->
<!-- DOCUMENTS TABLE -->
<!-- ===================================== -->

<div class="cyber-card mt-5">

<h3 class="glow mb-4">

<i class="fa-solid fa-folder-open"></i>

My Secure Documents

</h3>

<div class="table-responsive">

<table
class="table table-dark table-hover align-middle">

<thead>

<tr>

<th>
File Name
</th>

<th>
Upload Date
</th>

<th>
SHA-256 Hash
</th>

<th>
Verification
</th>

<th>
Actions
</th>

</tr>

</thead>

<tbody id="documentsTable">

</tbody>

</table>

</div>

</div>

</div>

</div>

</div>

<!-- ===================================== -->
<!-- USER INFO + LIVE CLOCK -->
<!-- ===================================== -->

<script>

const userToken =
localStorage.getItem(
    'token'
);

if (userToken) {

    const payload =
    JSON.parse(

        atob(

            userToken.split('.')[1]

        )

    );

    document.getElementById(
        'loggedUserName'
    ).innerHTML =
    payload.username;

    document.getElementById(
        'loggedUserEmail'
    ).innerHTML =
    payload.email;

    document.getElementById(
        'loggedUserRole'
    ).innerHTML =
    payload.role.toUpperCase();
}

// LIVE CLOCK

const clockElement =
document.getElementById(
    'liveClock'
);

if (clockElement) {

    setInterval(() => {

        const now =
        new Date();

        clockElement.innerHTML =

        now.toLocaleTimeString();

    }, 1000);
}

</script>


<!-- ===================================== -->
<!-- SCRIPTS -->
<!-- ===================================== -->

<script src="/js/auth.js"></script>

<script src="/js/upload.js"></script>

</body>

</html>
